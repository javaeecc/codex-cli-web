server:
  address: ${CODEX_WEB_HOST:127.0.0.1}
  port: ${CODEX_WEB_PORT:8090}
  servlet:
    session:
      timeout: 8h
      cookie:
        http-only: true
        same-site: strict
        secure: ${CODEX_WEB_COOKIE_SECURE:false}
  error:
    include-message: never

logging:
  file:
    name: ${CODEX_WEB_LOG_FILE:../data/logs/codex-web.log}
  logback:
    rollingpolicy:
      max-file-size: 20MB
      max-history: 14
      total-size-cap: 500MB
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"

codex-web:
  data-dir: ${CODEX_WEB_DATA_DIR:../data}
  codex-command: ${CODEX_COMMAND:codex.cmd}
  auth-token: ${CODEX_WEB_TOKEN:}
  login-username: ${CODEX_WEB_USERNAME:javaeecc@qq.com}
  login-password: ${CODEX_WEB_PASSWORD:javaeecc}
  max-upload-bytes: 10485760
  diff-max-bytes: 524288

server:
  address: ${CODEX_WEB_HOST:127.0.0.1}
  port: ${CODEX_WEB_PORT:8090}
  servlet:
    session:
      timeout: 8h
  error:
    include-message: never

codex-web:
  data-dir: ${CODEX_WEB_DATA_DIR:../data}
  codex-command: ${CODEX_COMMAND:codex.cmd}
  auth-token: ${CODEX_WEB_TOKEN:}
  login-username: ${CODEX_WEB_USERNAME:javaeecc@qq.com}
  login-password: ${CODEX_WEB_PASSWORD:javaeecc}
  max-upload-bytes: 10485760
  diff-max-bytes: 524288
